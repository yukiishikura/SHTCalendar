<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SHT Calendar</title>
  
  <!-- PWA & アプリアイコン設定 (常に最新を取得) -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <meta name="theme-color" content="#0F172A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SHT Calendar">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* アニメーション用トランジション */
    .modal-overlay {
      transition: opacity 0.25s ease-out;
    }
    .modal-sheet {
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen w-full flex flex-col items-center justify-start p-0 font-sans antialiased select-none">

  <!-- メインコンテナ（100%表示・上部配置） -->
  <div class="w-full max-w-[420px] min-h-screen bg-white shadow-sm border-x border-slate-200/80 flex flex-col justify-start relative pb-10">
    
    <!-- ヘッダーエリア -->
    <div class="bg-slate-900 text-white p-3.5 flex flex-col gap-3">
      
      <!-- タイトル & 年月切替 -->
      <div class="flex items-center justify-between">
        <button id="prevBtn" class="px-2.5 py-1.5 text-xs font-bold bg-slate-800 hover:bg-slate-700 active:bg-slate-600 border border-slate-700 rounded-lg text-slate-200 transition-colors">
          ‹ 前月
        </button>
        
        <!-- アイコンと右側テキストの高さを揃えたコンテナ -->
        <div class="flex items-center justify-center gap-2">
          <img src="icon.png" alt="SHT Icon" class="w-9 h-9 rounded-lg shadow-md border border-slate-700/60 object-cover shrink-0">
          <div class="flex flex-col justify-center text-left">
            <span class="text-[10px] uppercase tracking-widest text-teal-400 font-extrabold block leading-none mb-1">SHT Calendar</span>
            <h2 id="currentMonthYear" class="text-lg font-bold tracking-tight text-white leading-none">2026年 07月</h2>
          </div>
        </div>

        <button id="nextBtn" class="px-2.5 py-1.5 text-xs font-bold bg-slate-800 hover:bg-slate-700 active:bg-slate-600 border border-slate-700 rounded-lg text-slate-200 transition-colors">
          来月 ›
        </button>
      </div>
      
      <!-- 時間集計ダッシュボード (3列均等表示) -->
      <div class="grid grid-cols-3 gap-1.5">
        <!-- 1. 最低労働時間 -->
        <div class="bg-slate-800/90 border border-slate-700/80 p-2 rounded-xl flex flex-col items-center justify-center text-center">
          <span class="text-[9px] font-bold text-slate-400 block leading-tight mb-0.5">最低労働時間</span>
          <div class="flex items-baseline gap-0.5">
            <span id="targetHours" class="text-lg font-extrabold text-sky-400 leading-none">0</span>
            <span class="text-[10px] text-slate-400 font-medium">h</span>
          </div>
        </div>

        <!-- 2. 労働時間 -->
        <div class="bg-slate-800/90 border border-slate-700/80 p-2 rounded-xl flex flex-col items-center justify-center text-center">
          <span class="text-[9px] font-bold text-slate-400 block leading-tight mb-0.5">労働時間</span>
          <div class="flex items-baseline gap-0.5">
            <span id="totalHours" class="text-lg font-extrabold text-teal-400 leading-none">0</span>
            <span class="text-[10px] text-slate-400 font-medium">h</span>
          </div>
        </div>

        <!-- 3. 差分 -->
        <div class="bg-slate-800/90 border border-slate-700/80 p-2 rounded-xl flex flex-col items-center justify-center text-center">
          <span class="text-[9px] font-bold text-slate-400 block leading-tight mb-0.5">差分</span>
          <div class="flex items-baseline gap-0.5">
            <span id="diffHours" class="text-lg font-extrabold text-slate-300 leading-none">±0</span>
            <span class="text-[10px] text-slate-400 font-medium">h</span>
          </div>
        </div>
      </div>

    </div>

    <!-- カレンダーエリア -->
    <div class="p-2 flex-1 flex flex-col gap-3">
      <!-- 曜日ヘッダー ＆ カレンダーグリッド -->
      <div>
        <div class="grid grid-cols-7 gap-1 mb-1 text-center text-[11px] font-bold text-slate-500">
          <div class="text-red-500 py-0.5">日</div>
          <div class="py-0.5">月</div>
          <div class="py-0.5">火</div>
          <div class="py-0.5">水</div>
          <div class="py-0.5">木</div>
          <div class="py-0.5">金</div>
          <div class="text-blue-500 py-0.5">土</div>
        </div>

        <!-- 日付グリッド (最大7×5カラム=35マス制限) -->
        <div id="calendarGrid" class="grid grid-cols-7 gap-1"></div>
      </div>

      <!-- 左側固定タイトル ＆ 右側状態ボタン（デフォルト：固定（ロック）） -->
      <div class="flex items-center justify-between bg-slate-100/80 border border-slate-200/80 px-3.5 py-2.5 rounded-xl">
        <div class="flex items-center gap-2">
          <span class="text-sm">🔒</span>
          <span class="text-xs font-extrabold text-slate-700">勤務対象日の変更モード</span>
        </div>
        
        <button id="toggleLockBtn" class="text-xs font-extrabold px-3.5 py-1.5 rounded-lg border transition-all shadow-xs bg-amber-500 text-white border-amber-600 hover:bg-amber-600 active:bg-amber-700">
          固定（ロック）
        </button>
      </div>

      <!-- カレンダー下の「日別 備考メモ」カードエリア -->
      <div id="memoCard" class="bg-slate-50 border border-slate-200/90 rounded-2xl p-3.5 shadow-xs flex flex-col gap-2 transition-all">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-1.5">
            <span class="text-sm">📝</span>
            <span id="memoSelectedDateTitle" class="text-xs font-extrabold text-slate-700">選択日の備考メモ</span>
          </div>
          <span class="text-[10px] text-slate-400 font-bold">自動保存</span>
        </div>
        <textarea 
          id="dayMemoInput" 
          rows="2" 
          placeholder="タップしてこの日の備考・メモを入力（例: 直行直帰、在宅勤務、半休など）"
          class="w-full text-xs text-slate-800 bg-white border border-slate-200 rounded-xl p-2.5 focus:outline-none focus:ring-2 focus:ring-teal-500/50 focus:border-teal-500 transition-all placeholder:text-slate-400 resize-none"
        ></textarea>
      </div>
    </div>

    <!-- 右下の「最新アップデート」テキストリンク -->
    <div class="w-full px-3 py-1.5 flex justify-end items-center">
      <button id="forceUpdateBtn" class="text-[11px] font-bold text-slate-400 hover:text-teal-600 underline underline-offset-2 transition-colors flex items-center gap-1 cursor-pointer active:opacity-70">
        <span>🔄</span>
        <span>最新アップデート</span>
      </button>
    </div>

  </div>

  <!-- iOS風ボトムシートピッカーモーダル -->
  <div id="pickerModal" class="modal-overlay fixed inset-0 z-50 flex flex-col justify-end bg-slate-900/60 backdrop-blur-xs opacity-0 pointer-events-none">
    <!-- モーダルシート本体 -->
    <div id="pickerSheet" class="modal-sheet w-full max-w-[420px] mx-auto bg-white rounded-t-2xl p-4 shadow-2xl transform translate-y-full flex flex-col gap-3">
      <!-- つまみグラブバー -->
      <div class="w-10 h-1 bg-slate-300 rounded-full mx-auto"></div>
      
      <!-- ヘッダー -->
      <div class="flex items-center justify-between pb-2 border-b border-slate-100">
        <span id="modalDateTitle" class="text-sm font-extrabold text-slate-800">月 日</span>
        <button id="closeModalBtn" class="text-xs font-bold text-teal-600 hover:text-teal-700 bg-teal-50 px-3 py-1.5 rounded-lg active:bg-teal-100 transition-colors">
          完了
        </button>
      </div>
      
      <!-- 備考メモ入力（モーダル内） -->
      <div class="flex flex-col gap-1">
        <label class="text-[11px] font-bold text-slate-500 flex items-center gap-1">
          <span>📝</span> 備考メモ
        </label>
        <input 
          type="text" 
          id="modalMemoInput" 
          placeholder="備考を入力（例: 在宅、遅刻理由など）"
          class="w-full text-xs text-slate-800 bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-teal-500/50 focus:border-teal-500 transition-all placeholder:text-slate-400"
        >
      </div>

      <!-- 土曜・祝日用：勤務日/休日切り替えスイッチ（ダイナミック表示） -->
      <div id="holidayToggleContainer" class="hidden flex-col gap-1 pt-1 border-t border-slate-100">
        <span class="text-[11px] font-bold text-slate-500">日分の設定</span>
        <div class="grid grid-cols-2 gap-2">
          <button id="setHolidayBtn" class="py-2 px-3 rounded-xl text-xs font-bold border transition-all flex items-center justify-center gap-1">
            <span>🌴</span> 休日にする
          </button>
          <button id="setWorkdayBtn" class="py-2 px-3 rounded-xl text-xs font-bold border transition-all flex items-center justify-center gap-1">
            <span>💼</span> 勤務日にする
          </button>
        </div>
      </div>

      <!-- 選択項目リスト (iOS ActionSheet 風 プルダウン/時間選択) -->
      <div id="optionListContainer" class="flex flex-col gap-1">
        <span class="text-[11px] font-bold text-slate-500">勤務時間 / 区分</span>
        <div id="modalOptionList" class="max-h-[200px] overflow-y-auto flex flex-col gap-1 py-1 pr-1">
          <!-- JSで動的にボタン項目を出力 -->
        </div>
      </div>
    </div>
  </div>

  <script>
    let currentDate = new Date();
    const workData = {};
    let activeDateString = null;
    let selectedCellDateString = null; // 現在選択表示（フォーカス）中の日付
    let isDateSelectionLocked = true;   // デフォルトで勤務対象日を固定（ロック）
    const holidayCache = {};
    let onlineHolidays = {};
    const STORAGE_KEY = 'sht_calendar_work_data_v1';
    const FOCUS_STORAGE_KEY = 'sht_calendar_focused_date_v1';

    const currentMonthYearEl = document.getElementById('currentMonthYear');
    const calendarGridEl = document.getElementById('calendarGrid');
    const targetHoursEl = document.getElementById('targetHours');
    const totalHoursEl = document.getElementById('totalHours');
    const diffHoursEl = document.getElementById('diffHours');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    const toggleLockBtn = document.getElementById('toggleLockBtn');

    const pickerModal = document.getElementById('pickerModal');
    const pickerSheet = document.getElementById('pickerSheet');
    const modalDateTitle = document.getElementById('modalDateTitle');
    const holidayToggleContainer = document.getElementById('holidayToggleContainer');
    const setHolidayBtn = document.getElementById('setHolidayBtn');
    const setWorkdayBtn = document.getElementById('setWorkdayBtn');
    const optionListContainer = document.getElementById('optionListContainer');
    const modalOptionList = document.getElementById('modalOptionList');
    const modalMemoInput = document.getElementById('modalMemoInput');
    const closeModalBtn = document.getElementById('closeModalBtn');

    const memoSelectedDateTitle = document.getElementById('memoSelectedDateTitle');
    const dayMemoInput = document.getElementById('dayMemoInput');
    const forceUpdateBtn = document.getElementById('forceUpdateBtn');

    // ── 最新アップデート（フォーカス状態を100%維持して最新コードに更新） ──
    forceUpdateBtn.addEventListener('click', async () => {
      forceUpdateBtn.innerHTML = "<span>🔄</span> <span>更新中...</span>";
      
      if (selectedCellDateString) {
        localStorage.setItem(FOCUS_STORAGE_KEY, selectedCellDateString);
      }

      try {
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map(key => caches.delete(key)));
        }
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          for (let reg of registrations) {
            await reg.unregister();
          }
        }
      } catch (e) {
        console.error('Update error:', e);
      }
      window.location.reload(true);
    });

    // ── ロック状態のUIトグル更新（ボタンテキストで判別） ──
    function updateLockUI() {
      if (isDateSelectionLocked) {
        toggleLockBtn.textContent = "固定（ロック）";
        toggleLockBtn.className = "text-xs font-extrabold px-3.5 py-1.5 rounded-lg border transition-all shadow-xs bg-amber-500 text-white border-amber-600 hover:bg-amber-600 active:bg-amber-700";
      } else {
        toggleLockBtn.textContent = "変更モード";
        toggleLockBtn.className = "text-xs font-extrabold px-3.5 py-1.5 rounded-lg border transition-all shadow-xs bg-white text-slate-700 border-slate-300 hover:bg-slate-50 active:bg-slate-100";
      }
    }

    toggleLockBtn.addEventListener('click', () => {
      isDateSelectionLocked = !isDateSelectionLocked;
      updateLockUI();
    });

    // ── データの保存 & 復元（フォーカス記憶対応） ──
    function loadWorkData() {
      try {
        const savedStr = localStorage.getItem(STORAGE_KEY);
        if (savedStr) {
          const parsed = JSON.parse(savedStr);
          Object.assign(workData, parsed);
        }

        const savedFocusedDate = localStorage.getItem(FOCUS_STORAGE_KEY);
        if (savedFocusedDate) {
          selectedCellDateString = savedFocusedDate;
          const [fYear, fMonth] = savedFocusedDate.split('-').map(Number);
          currentDate = new Date(fYear, fMonth - 1, 1);
        }
      } catch (e) {
        console.error('Failed to load saved data:', e);
      }
    }

    function saveWorkData() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(workData));
      } catch (e) {
        console.error('Failed to save data:', e);
      }
    }

    // ── ネットから最新の祝日データを自動非同期同期 ──
    async function syncLatestHolidays() {
      try {
        const res = await fetch('https://holidays-jp.github.io/api/v1/date.json');
        if (res.ok) {
          const data = await res.json();
          onlineHolidays = data;
          renderCalendar();
        }
      } catch (e) {
        // オフラインフォールバック
      }
    }

    // ── 2028年以降・未来の全年に対応する自動祝日計算プログラム ──
    function getHolidaysOfYear(year) {
      if (holidayCache[year]) return holidayCache[year];

      const h = {};
      const pad = (n) => String(n).padStart(2, '0');
      const makeStr = (m, d) => `${year}-${pad(m)}-${pad(d)}`;

      // 1. 固定祝日
      h[makeStr(1, 1)] = "元日";
      h[makeStr(2, 11)] = "建国記念の日";
      h[makeStr(2, 23)] = "天皇誕生日";
      h[makeStr(4, 29)] = "昭和の日";
      h[makeStr(5, 3)] = "憲法記念日";
      h[makeStr(5, 4)] = "みどりの日";
      h[makeStr(5, 5)] = "こどもの日";
      h[makeStr(8, 11)] = "山の日";
      h[makeStr(11, 3)] = "文化の日";
      h[makeStr(11, 23)] = "勤労感謝の日";

      // 2. ハッピーマンデー
      function getNthMonday(m, n) {
        let count = 0;
        for (let d = 1; d <= 31; d++) {
          const dt = new Date(year, m - 1, d);
          if (dt.getMonth() !== m - 1) break;
          if (dt.getDay() === 1) {
            count++;
            if (count === n) return d;
          }
        }
        return 1;
      }

      h[makeStr(1, getNthMonday(1, 2))] = "成人の日";
      h[makeStr(7, getNthMonday(7, 3))] = "海の日";
      h[makeStr(9, getNthMonday(9, 3))] = "敬老の日";
      h[makeStr(10, getNthMonday(10, 2))] = "スポーツの日";

      // 3. 春分の日・秋分の日
      const syunbunDay = Math.floor(20.8431 + 0.242194 * (year - 1980) - Math.floor((year - 1980) / 4));
      const syubunDay = Math.floor(23.2488 + 0.242194 * (year - 1980) - Math.floor((year - 1980) / 4));
      h[makeStr(3, syunbunDay)] = "春分の日";
      h[makeStr(9, syubunDay)] = "秋分の日";

      // 4. 国民の休日
      const isLeap = (year % 4 === 0 && year % 100 !== 0) || (year % 400 === 0);
      const daysInMonth = [31, isLeap ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];

      for (let m = 1; m <= 12; m++) {
        for (let d = 2; d < daysInMonth[m - 1]; d++) {
          const currStr = makeStr(m, d);
          const prevStr = makeStr(m, d - 1);
          const nextStr = makeStr(m, d + 1);
          
          const dt = new Date(year, m - 1, d);
          if (dt.getDay() !== 0 && dt.getDay() !== 6) {
            if (h[prevStr] && h[nextStr] && !h[currStr]) {
              h[currStr] = "国民の休日";
            }
          }
        }
      }

      // 5. 振替休日
      const sortedDates = Object.keys(h).sort();
      sortedDates.forEach(dateStr => {
        const [y, m, d] = dateStr.split('-').map(Number);
        const dt = new Date(y, m - 1, d);
        if (dt.getDay() === 0) {
          let subD = new Date(y, m - 1, d + 1);
          let subStr = `${subD.getFullYear()}-${pad(subD.getMonth() + 1)}-${pad(subD.getDate())}`;
          while (h[subStr]) {
            subD.setDate(subD.getDate() + 1);
            subStr = `${subD.getFullYear()}-${pad(subD.getMonth() + 1)}-${pad(subD.getDate())}`;
          }
          h[subStr] = "振替休日";
        }
      });

      holidayCache[year] = h;
      return h;
    }

    function getHolidayName(dateString) {
      if (onlineHolidays[dateString]) {
        return onlineHolidays[dateString];
      }
      const year = parseInt(dateString.split('-')[0]);
      const yearHolidays = getHolidaysOfYear(year);
      return yearHolidays[dateString];
    }

    function isHoliday(dateString) {
      return getHolidayName(dateString) !== undefined;
    }

    function renderCalendar() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      currentMonthYearEl.textContent = `${year}年 ${String(month + 1).padStart(2, '0')}月`;
      calendarGridEl.innerHTML = '';

      const firstDayIndex = new Date(year, month, 1).getDay();
      const lastDate = new Date(year, month + 1, 0).getDate();
      const prevLastDate = new Date(year, month, 0).getDate();

      const MAX_CELLS = 35;
      let cellCount = 0;

      for (let i = firstDayIndex; i > 0; i--) {
        if (cellCount >= MAX_CELLS) break;
        const dateVal = prevLastDate - i + 1;
        const prevMonth = month === 0 ? 11 : month - 1;
        const prevYear = month === 0 ? year - 1 : year;
        createDayCell(prevYear, prevMonth, dateVal, true);
        cellCount++;
      }

      for (let dateVal = 1; dateVal <= lastDate; dateVal++) {
        if (cellCount >= MAX_CELLS) break;
        createDayCell(year, month, dateVal, false);
        cellCount++;
      }

      for (let dateVal = 1; cellCount < MAX_CELLS; dateVal++) {
        const nextMonth = month === 11 ? 0 : month + 1;
        const nextYear = month === 11 ? year + 1 : year;
        createDayCell(nextYear, nextMonth, dateVal, true);
        cellCount++;
      }

      if (!selectedCellDateString) {
        const defaultStr = `${year}-${String(month + 1).padStart(2, '0')}-01`;
        selectDateForMemo(defaultStr);
      } else {
        updateBottomMemoCard(selectedCellDateString);
      }

      calculateTotal();
    }

    function createDayCell(year, month, dateVal, isAdjacentMonth) {
      const dateString = `${year}-${String(month + 1).padStart(2, '0')}-${String(dateVal).padStart(2, '0')}`;
      const dayOfWeek = new Date(year, month, dateVal).getDay();
      
      const isSun = dayOfWeek === 0;
      const isSat = dayOfWeek === 6;
      const holidayName = isAdjacentMonth ? undefined : getHolidayName(dateString);
      const isHol = holidayName !== undefined;
      const isSatOrHol = isSat || isHol;

      if (!workData[dateString]) {
        // 平日（日曜および土祝を除く）はデフォルトで勤務対象日
        const isDefaultSelected = !isSun && !isSatOrHol;
        workData[dateString] = { value: "", hours: null, isSelected: isDefaultSelected, memo: "" };
      }
      const dayData = workData[dateString];

      const cell = document.createElement('div');
      
      let cellClass = 'min-h-[68px] border rounded-lg p-1 flex flex-col justify-between transition-all duration-150 relative ';
      
      if (isAdjacentMonth) {
        cellClass += 'bg-slate-50/60 border-slate-100 text-slate-300';
      } else if (selectedCellDateString === dateString) {
        cellClass += 'bg-sky-100/90 border-2 border-teal-500 text-slate-900 shadow-md ring-2 ring-teal-500/20';
      } else if (isSun) {
        cellClass += 'bg-red-50/25 border-red-100 text-red-400';
      } else if (isHol) {
        cellClass += 'bg-red-50/25 border-red-100 text-red-400';
      } else if (dayData.value === 'PAID') {
        cellClass += 'bg-emerald-50 border-emerald-300 text-emerald-900 shadow-sm';
      } else if (dayData.value === 'SFT') {
        cellClass += 'bg-purple-50 border-purple-300 text-purple-900 shadow-sm';
      } else if (dayData.isSelected) {
        cellClass += 'bg-sky-50/70 border-sky-300 text-sky-900 cursor-pointer';
      } else {
        cellClass += 'bg-white border-slate-200 text-slate-700 hover:border-slate-300 cursor-pointer';
      }
      cell.className = cellClass;

      cell.addEventListener('click', (e) => {
        selectDateForMemo(dateString);

        // 1. 日曜日はメモ選択のみ（勤務時間なし）
        if (isSun || isAdjacentMonth) return;

        // 2. 土曜・祝日：ロック解除中（isDateSelectionLocked === false）の時だけモーダルを開いて設定可能に！
        if (isSatOrHol) {
          if (!isDateSelectionLocked) {
            openPickerModal(year, month, dateVal, dateString, true);
          }
          return;
        }

        // 3. 平日：ピッカーボタン以外のセル背景タップ時（変更モード時のみON/OFF切替）
        if (!e.target.closest('.picker-btn')) {
          if (!isDateSelectionLocked) {
            dayData.isSelected = !dayData.isSelected;
            saveWorkData();
          }
          renderCalendar();
        }
      });

      // 日付ヘッダー
      const dayHeader = document.createElement('div');
      dayHeader.className = 'flex items-baseline justify-between w-full leading-none px-0.5 pt-0.5';
      
      const dayNumContainer = document.createElement('div');
      dayNumContainer.className = 'flex items-center gap-0.5';

      const dayNum = document.createElement('span');
      dayNum.className = `text-xs font-extrabold ${
        isAdjacentMonth 
          ? 'text-slate-300' 
          : (isSun || isHol ? 'text-red-500' : (isSat ? 'text-blue-500' : 'text-slate-800'))
      }`;
      dayNum.textContent = dateVal;
      dayNumContainer.appendChild(dayNum);

      if (dayData.memo && dayData.memo.trim() !== "") {
        const memoBadge = document.createElement('span');
        memoBadge.className = 'text-[9px] leading-none';
        memoBadge.textContent = '📝';
        memoBadge.title = dayData.memo;
        dayNumContainer.appendChild(memoBadge);
      }

      dayHeader.appendChild(dayNumContainer);

      if (isHol) {
        const holidayLabel = document.createElement('span');
        holidayLabel.className = 'text-[8px] text-red-400 font-bold truncate max-w-[32px]';
        holidayLabel.textContent = holidayName;
        dayHeader.appendChild(holidayLabel);
      }
      cell.appendChild(dayHeader);

      // カスタム表示ボタン（勤務時間入力欄）
      // 平日、または「勤務時間/値が入力されている土祝」に表示！
      const shouldShowPickerBtn = !isAdjacentMonth && !isSun && (!isSatOrHol || dayData.isSelected || dayData.value !== "");

      if (shouldShowPickerBtn) {
        const pickerBtn = document.createElement('button');
        pickerBtn.className = 'picker-btn w-full text-[10px] font-extrabold border rounded py-1 transition-all flex items-center justify-center gap-0.5 ';
        
        let labelText = "-";
        if (dayData.value === 'PAID') {
          labelText = "有給";
          pickerBtn.className += 'bg-emerald-100 border-emerald-400 text-emerald-900';
        } else if (dayData.value === 'SFT') {
          labelText = "SFT";
          pickerBtn.className += 'bg-purple-100 border-purple-400 text-purple-900';
        } else if (dayData.value !== "") {
          labelText = `${dayData.value}h`;
          pickerBtn.className += 'bg-sky-100 border-sky-400 text-sky-900';
        } else if (dayData.isSelected) {
          pickerBtn.className += 'bg-sky-50/80 border-sky-200 text-slate-600 hover:border-sky-300';
        } else {
          pickerBtn.className += 'bg-slate-50 border-slate-200 text-slate-400 hover:border-slate-300';
        }

        pickerBtn.textContent = labelText;

        pickerBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          selectDateForMemo(dateString);
          // ロック解除中（isDateSelectionLocked === false）の時だけ時間設定モーダルを開く
          if (!isDateSelectionLocked) {
            openPickerModal(year, month, dateVal, dateString, isSatOrHol);
          }
        });

        cell.appendChild(pickerBtn);
      } else {
        const spacer = document.createElement('div');
        spacer.className = 'h-5';
        cell.appendChild(spacer);
      }

      calendarGridEl.appendChild(cell);
    }

    // ── カレンダー下部の備考メモカードの更新 & フォーカス位置保存 ──
    function selectDateForMemo(dateString) {
      selectedCellDateString = dateString;
      try {
        localStorage.setItem(FOCUS_STORAGE_KEY, dateString);
      } catch (e) {}
      updateBottomMemoCard(dateString);
      renderCalendarHighlightOnly();
    }

    function renderCalendarHighlightOnly() {
      renderCalendar();
    }

    function updateBottomMemoCard(dateString) {
      if (!dateString) return;
      const [y, m, d] = dateString.split('-').map(Number);
      const weekDays = ["日", "月", "火", "水", "木", "金", "土"];
      const dayOfWeek = weekDays[new Date(y, m - 1, d).getDay()];
      
      memoSelectedDateTitle.textContent = `${m}月${d}日 (${dayOfWeek}) の備考メモ`;
      
      if (!workData[dateString]) {
        workData[dateString] = { value: "", hours: null, isSelected: false, memo: "" };
      }
      dayMemoInput.value = workData[dateString].memo || "";
    }

    dayMemoInput.addEventListener('input', (e) => {
      if (!selectedCellDateString) return;
      if (!workData[selectedCellDateString]) {
        workData[selectedCellDateString] = { value: "", hours: null, isSelected: false, memo: "" };
      }
      workData[selectedCellDateString].memo = e.target.value;
      saveWorkData();
    });

    // iOS風ボトムシートピッカーモーダルの開閉処理
    function openPickerModal(year, month, dateVal, dateString, isSatOrHol = false) {
      activeDateString = dateString;
      const weekDays = ["日", "月", "火", "水", "木", "金", "土"];
      const dayOfWeek = weekDays[new Date(year, month, dateVal).getDay()];
      
      modalDateTitle.textContent = `${month + 1}月${dateVal}日 (${dayOfWeek}) の設定`;

      if (!workData[dateString]) {
        workData[dateString] = { value: "", hours: null, isSelected: !isSatOrHol, memo: "" };
      }
      const dayData = workData[dateString];

      modalMemoInput.value = dayData.memo || "";

      // 土祝の場合：勤務日にする / 休日にする 切替スイッチを表示！
      if (isSatOrHol) {
        holidayToggleContainer.classList.remove('hidden');
        holidayToggleContainer.classList.add('flex');

        updateHolidayToggleButtons(dayData.isSelected || dayData.value !== "");
      } else {
        holidayToggleContainer.classList.add('hidden');
        holidayToggleContainer.classList.remove('flex');
        optionListContainer.classList.remove('hidden');
      }

      renderModalOptions(dateString);

      pickerModal.classList.remove('opacity-0', 'pointer-events-none');
      pickerSheet.classList.remove('translate-y-full');
    }

    function updateHolidayToggleButtons(isWorkday) {
      if (isWorkday) {
        // 勤務日選択中
        setWorkdayBtn.className = "py-2 px-3 rounded-xl text-xs font-bold border transition-all flex items-center justify-center gap-1 bg-teal-50 text-teal-700 border-teal-500 shadow-xs";
        setHolidayBtn.className = "py-2 px-3 rounded-xl text-xs font-bold border transition-all flex items-center justify-center gap-1 bg-slate-50 text-slate-500 border-slate-200 hover:bg-slate-100";
        optionListContainer.classList.remove('hidden');
      } else {
        // 休日選択中
        setHolidayBtn.className = "py-2 px-3 rounded-xl text-xs font-bold border transition-all flex items-center justify-center gap-1 bg-red-50 text-red-700 border-red-300 shadow-xs";
        setWorkdayBtn.className = "py-2 px-3 rounded-xl text-xs font-bold border transition-all flex items-center justify-center gap-1 bg-slate-50 text-slate-500 border-slate-200 hover:bg-slate-100";
        optionListContainer.classList.add('hidden');
      }
    }

    setHolidayBtn.addEventListener('click', () => {
      if (!activeDateString) return;
      const dayData = workData[activeDateString];
      dayData.isSelected = false;
      dayData.value = "";
      dayData.hours = null;
      saveWorkData();
      updateHolidayToggleButtons(false);
      renderCalendar();
    });

    setWorkdayBtn.addEventListener('click', () => {
      if (!activeDateString) return;
      const dayData = workData[activeDateString];
      dayData.isSelected = true;
      if (!dayData.value) {
        dayData.value = "8.0";
        dayData.hours = 8.0;
      }
      saveWorkData();
      updateHolidayToggleButtons(true);
      renderModalOptions(activeDateString);
      renderCalendar();
    });

    function renderModalOptions(dateString) {
      modalOptionList.innerHTML = '';
      const currentVal = workData[dateString]?.value || "";

      const options = [
        { val: "", label: "-" },
        { val: "PAID", label: "有給" },
        { val: "SFT", label: "SFT" },
      ];

      for (let h = 2.0; h <= 12.0; h += 0.5) {
        options.push({ val: h.toFixed(1), label: `${h.toFixed(1)}h` });
      }

      options.forEach(opt => {
        const itemBtn = document.createElement('button');
        const isSelected = currentVal === opt.val;
        
        itemBtn.className = `w-full px-4 py-2 rounded-xl text-xs font-bold flex items-center justify-between transition-all ${
          isSelected 
            ? 'bg-teal-50 text-teal-700 border-2 border-teal-500 shadow-xs' 
            : 'bg-slate-50 hover:bg-slate-100 text-slate-700 border border-slate-200/80 active:bg-slate-200'
        }`;

        itemBtn.innerHTML = `
          <span>${opt.label}</span>
          ${isSelected ? `<svg class="w-4 h-4 text-teal-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg>` : ''}
        `;

        itemBtn.addEventListener('click', () => {
          updateDayValue(dateString, opt.val);
          closePickerModal();
        });

        modalOptionList.appendChild(itemBtn);
      });
    }

    modalMemoInput.addEventListener('input', (e) => {
      if (!activeDateString) return;
      if (!workData[activeDateString]) {
        workData[activeDateString] = { value: "", hours: null, isSelected: false, memo: "" };
      }
      workData[activeDateString].memo = e.target.value;
      dayMemoInput.value = e.target.value;
      saveWorkData();
    });

    function closePickerModal() {
      pickerSheet.classList.add('translate-y-full');
      pickerModal.classList.add('opacity-0', 'pointer-events-none');
      renderCalendar();
    }

    function updateDayValue(dateString, val) {
      if (!workData[dateString]) return;
      const dayData = workData[dateString];
      dayData.value = val;

      if (val === "") {
        dayData.hours = null;
      } else if (val === "PAID") {
        dayData.hours = 8.0;
        dayData.isSelected = true;
      } else if (val === "SFT") {
        dayData.hours = 0.0;
        dayData.isSelected = true;
      } else {
        dayData.hours = parseFloat(val);
        dayData.isSelected = true;
      }

      saveWorkData();
      renderCalendar();
    }

    pickerModal.addEventListener('click', (e) => {
      if (e.target === pickerModal) {
        closePickerModal();
      }
    });

    closeModalBtn.addEventListener('click', closePickerModal);

    function calculateTotal() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      
      let totalPlanned = 0;
      let selectedDaysCount = 0;

      for (const [key, value] of Object.entries(workData)) {
        const [kYear, kMonth] = key.split('-').map(Number);
        if (kYear === year && kMonth === (month + 1)) {
          if (value.hours !== null) {
            totalPlanned += value.hours;
          }
          if (value.isSelected) {
            selectedDaysCount++;
          }
        }
      }

      const targetTotal = selectedDaysCount * 8;
      const diff = totalPlanned - targetTotal;
      let diffText = "";
      
      if (diff > 0) {
        diffText = `+${diff}`;
        diffHoursEl.className = "text-lg font-extrabold leading-none text-emerald-400";
      } else if (diff < 0) {
        diffText = `${diff}`;
        diffHoursEl.className = "text-lg font-extrabold leading-none text-red-400";
      } else {
        diffText = "±0";
        diffHoursEl.className = "text-lg font-extrabold leading-none text-slate-300";
      }

      targetHoursEl.textContent = targetTotal;
      totalHoursEl.textContent = totalPlanned;
      diffHoursEl.textContent = diffText;
    }

    prevBtn.addEventListener('click', () => {
      currentDate.setMonth(currentDate.getMonth() - 1);
      selectedCellDateString = null;
      renderCalendar();
    });

    nextBtn.addEventListener('click', () => {
      currentDate.setMonth(currentDate.getMonth() + 1);
      selectedCellDateString = null;
      renderCalendar();
    });

    // PWA Service Worker の自動登録 ＆ ソース更新時のシームレス自動反映
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then((reg) => {
          reg.addEventListener('updatefound', () => {
            const newWorker = reg.installing;
            newWorker.addEventListener('statechange', () => {
              if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                if (selectedCellDateString) {
                  localStorage.setItem(FOCUS_STORAGE_KEY, selectedCellDateString);
                }
                window.location.reload();
              }
            });
          });
        }).catch(err => console.log('SW reg info:', err));
      });
    }

    // 初期表示レンダリング
    loadWorkData();
    updateLockUI();
    renderCalendar();
    syncLatestHolidays();
  </script>
</body>
</html>
